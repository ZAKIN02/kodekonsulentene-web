name: Lighthouse

on:
  pull_request:

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Start serveren
        run: |
          npm start &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/ >/dev/null && exit 0
            sleep 1
          done
          echo "Serveren svarte ikke innen 60 sekunder" >&2
          exit 1
        env:
          HOST: 0.0.0.0
          PORT: 8080

      - name: Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            http://localhost:8080/
            http://localhost:8080/priser
            http://localhost:8080/sjekk
          configPath: .github/lighthouse-budsjett.json
          uploadArtifacts: true
          temporaryPublicStorage: true
